services:
  ntfy:
    image: binwiederhier/ntfy:latest # ensures latest image is pulled
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: ${TZ}    # desired timezone
      NTFY_BASE_URL: ${Base_URL} # custom URL for the ntfy server
      NTFY_BEHIND_PROXY: true
    user: 1000:1000 # user and group id for non-root access
    volumes:
      - ./var/cache/ntfy:/var/cache/ntfy # added "." at start so that all folders and files are within the docker folder
      - ./etc/ntfy:/etc/ntfy # added "." at start so that all folders and files are within the docker folder
    ports:
      - 8080:80 # port 80 already in use. Binding to different port
    healthcheck: # optional: remember to adapt the host:port to your environment - updated to match above port
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:8080/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes
